name: VoiceUncloak
options:
  bundleIdPrefix: com.voicedecloak
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  VoiceUncloak:
    type: application
    platform: iOS
    sources:
      - path: VoiceUncloak
        type: group
    settings:
      base:
        INFOPLIST_FILE: VoiceUncloak/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.voicedecloak.app
        PRODUCT_NAME: "声纹还原"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false
        inputFiles: []
        outputFiles: []
